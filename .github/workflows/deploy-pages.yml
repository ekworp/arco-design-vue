name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace tooling
        run: |
          pnpm --filter @arco-design/vite-plugin-arco-vue-docs build
          pnpm --filter @arco-design/arco-vue-scripts build

      - name: Generate package sources
        run: pnpm --filter @ekworp/arco-design-vue run icongen

      - name: Build package
        run: pnpm --filter @ekworp/arco-design-vue build

      - name: Build documentation site
        env:
          AssetsPublicPath: /arco-design-vue/
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run build:site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/arco-vue-docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
