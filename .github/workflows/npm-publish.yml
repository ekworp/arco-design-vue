name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace tooling
        run: |
          pnpm --filter @arco-design/vite-plugin-arco-vue-docs build
          pnpm --filter @arco-design/arco-vue-scripts build

      - name: Generate package sources
        run: pnpm --filter @ekworp/arco-design-vue run icongen

      - name: Build package
        run: pnpm --filter @ekworp/arco-design-vue build

      - name: Publish to npm
        run: npm stage publish .
        working-directory: packages/web-vue
